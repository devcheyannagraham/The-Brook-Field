spring.application.name=BFIMS
spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:h2:./bfims;AUTO_SERVER=TRUE
spring.datasource.username=
spring.datasource.password=

spring.jpa.show-sql=true
server.port=8080

#Enable if keys available
server.ssl.enabled=true
server.ssl.key-alias=local_host_ssl
server.ssl.key-store=classpath:local_host_ssl.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-password=localhost
server.ssl.key-store-password=localhost
