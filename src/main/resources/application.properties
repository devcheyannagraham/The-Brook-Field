spring.application.name=BFIMS

spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/bfims
spring.datasource.username=bfUser
spring.datasource.password=bfUser
spring.jpa.show-sql=true

server.port=8080
server.ssl.enabled=true
server.ssl.key-alias=local_host_ssl
server.ssl.key-store=classpath:local_host_ssl.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-password=localhost
server.ssl.key-store-password=localhost
