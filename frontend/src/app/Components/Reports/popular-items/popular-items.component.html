<back />

<div>
    @if(popularItems && popularItems.length > 0){
    <table>
        <thead>
            <tr>
                <th>{{headers.title}}</th>
                <th>{{headers.totalUnitsSold}}</th>
                <th>{{headers.totalProfit}}</th>
            </tr>
        </thead>
        <tbody>
            @for(item of popularItems;track `$${item.id}-${item.title}`){
            <tr>
                <td>{{item.title}}</td>
                <td>{{item.totalUnitsSold}}</td>
                <td>{{item.totalProfit | currency}}</td>
            </tr>
            }

        </tbody>
    </table>
    }
    @else {
    <p>No items to display</p>
    }
</div>
