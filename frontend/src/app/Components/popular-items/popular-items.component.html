<div>
    <table>
        <thead>
            <tr>
                <th>{{headers.title}}</th>
                <th>T{{headers.totalUnitsSold}}</th>
                <th>T{{headers.totalProfit}}</th>
            </tr>
        </thead>
        <tbody>
            @for(item of popularItems;track item.id){
            <tr>
                <td>{{item.title}}</td>
                <td>{{item.totalUnitsSold}}</td>
                <td>{{item.totalProfit | currency}}</td>
            </tr>
            }

        </tbody>
    </table>
</div>
