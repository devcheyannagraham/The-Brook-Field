<div>
    <h2>{{actionType =="LOGIN"? "Login" : "Register" }}</h2>
    <form (submit)="submitForm()">

        <div class="label-group">
            <label for="email"> Email</label>
            <input type="email" required [formControl]="email">

            @if(emailError){
            <p class="error">Invalid Email</p>
            }
        </div>
        <div class="label-group">
            <label for="pwd"> Password</label>
            <input type="password" required [formControl]="pwd">
            @if(pwdError){
            <p class="error">Invalid password</p>
            }
        </div>
        @if(actionType == "REGISTER"){
        <div class="label-group">
            <label for="pwdConf"> Confirm Password</label>
            <input type="password" required [formControl]="pwdConf">
            @if(pwdConfError){
            <p class="error">Passwords don't match!</p>
            }
        </div>

        }
        <div>
            <button type="submit">{{actionType =="LOGIN"? "Login" : "Register" }}</button>
        </div>
    </form>
</div>
