<h3>{{ accessoryId ? "Update" : "New" }} Accessory</h3>
<form [formGroup]="accessoryForm" (ngSubmit)="addAccessory()">
  <div class="label-group">
    <label for="accessoryName">Accessory Name</label>
    <input type="text" id="accessoryName" name="accessoryName" formControlName="accessoryName">
  </div>

  <div class="label-group">
    <label for="accessoryType">Accessory Type</label>
    <select id="accessoryType" name="accessoryType" formControlName="accessoryType">
      <option value="{{AccessoryType.BOOKMARK}}">Bookmark</option>
      <option value="{{AccessoryType.MUG}}">Mug</option>
      <option value="{{AccessoryType.PEN}}">Pen</option>
    </select>
  </div>

  <div class="label-group">
    <label for="price">Price</label>
    <input type="text" id="price" name="price" formControlName="price">
  </div>

  <div class="label-group">
    <label for="quantity">Quantity</label>
    <input type="text" id="quantity" name="quantity" formControlName="quantity">
  </div>
  <button type="submit">{{ accessoryId ? "Update Accessory" : "Add Accessory" }}</button>
</form>
