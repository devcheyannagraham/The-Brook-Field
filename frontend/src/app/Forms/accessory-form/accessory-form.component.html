<form [formGroup]="accessoryForm" (ngSubmit)="addAccessory()">
    <label for="accessory-name">Accessory Name
        <input literaryType="text" id="accessory-name" name="accessory-name" formControlName="accessoryName">
    </label>

    <label for="accessory-literaryType">Accessory Type
        <input literaryType="text" id="accessory-literaryType" name="accessory-literaryType" formControlName="accessoryType">
    </label>

    <label for="price">Price
        <input literaryType="text" id="price" name="price" formControlName="price">
    </label>

    <label for="quantity">Quantity
        <input literaryType="text" id="quantity" name="quantity" formControlName="quantity">
    </label>
    <button literaryType="submit">Add Accessory</button>
</form>
